[theme]
inherit              = basic
stylesheet           = pygame.css
pygments_style       = sphinx

[options]
home_uri             = ''
embedded             = true
nosidebar            = true
nofooter             = true
relbar               = false
noheader             = false
noheading            = false
notableofcontents    = false

footerbgcolor        = #131e1c
footertextcolor      = #a7c4bc
sidebarbgcolor       = #1c2d2a
sidebartextcolor     = #e2e8f0
sidebarlinkcolor     = #34d399
relbarbgcolor        = #131e1c
relbartextcolor      = #e2e8f0
relbarlinkcolor      = #34d399
bgcolor              = #0e1413
textcolor            = #e2e8f0
headbgcolor          = transparent
headtextcolor        = #ffffff
headlinkcolor        = #34d399
linkcolor            = #34d399
codebgcolor          = #0b100f
codetextcolor        = #e2e8f0
cautionbgcolor       = #2a2015
notebgcolor          = #162320
highlightbgcolor     = #20352e
headerbgcolor        = #131e1c
logobgcolor          = #1c2d2a
keywordbgcolor       = #162320
examplebgcolor       = #131e1c
tooltipbgcolor       = #1c2d2a
tooltipbdrcolor      = #2d4842

headerborder         = 1px solid #2d4842

bodyfont             = -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif
headfont             = -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif
sigfont              = "JetBrains Mono", "Fira Code", "Cascadia Code", ui-monospace, Menlo, Consolas, monospace
